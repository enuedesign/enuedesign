# e.NUE Design — Netlify 배포 설정
# 정적 사이트라 빌드 과정이 없습니다. 파일을 그대로 올립니다.

[build]
  publish = "."
  command = ""

# 포트폴리오 이미지는 파일명이 바뀌지 않는 한 내용도 안 바뀝니다.
# 1년 캐시를 걸어두면 재방문자는 이미지를 다시 받지 않습니다.
[[headers]]
  for = "/assets/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML과 작업물 데이터는 수정 즉시 반영돼야 하므로 캐시하지 않습니다.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# /admin 은 Sveltia CMS 단일 페이지 앱이라 하위 경로를 전부 index.html 로 넘겨야 합니다.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

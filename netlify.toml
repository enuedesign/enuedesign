# e.NUE Design — Netlify 배포 설정
# 정적 사이트라 빌드 과정이 없습니다. 파일을 그대로 올립니다.

[build]
  publish = "."
  command = ""

# 포트폴리오 이미지 — 1일 캐시.
# 예전에는 1년 immutable 이었는데, 같은 파일명으로 사진만 교체하면
# 방문자 브라우저가 1년 내내 옛 사진을 보여주는 문제가 있었다.
# 하루면 교체가 자연스럽게 반영되고, 트래픽 증가도 미미하다.
[[headers]]
  for = "/assets/portfolio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML과 작업물 데이터는 수정 즉시 반영돼야 하므로 캐시하지 않습니다.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 기본 보안 헤더
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# /admin 은 Sveltia CMS 단일 페이지 앱이라 하위 경로를 전부 index.html 로 넘겨야 합니다.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

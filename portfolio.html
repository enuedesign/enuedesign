<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | e.NUE Design — Carrollton, TX</title>
<meta name="description" content="Selected design and print work by e.NUE Design — menus, signs, window graphics and branding for cafes, restaurants, dental offices and churches around Dallas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&display=swap">
<style>
:root{
  --ink:#12161B;
  --ink-soft:#3A424C;
  --muted:#7B7566;
  --line:#D6D0C2;
  --beige:#E9E4D9;        /* Focus Lab-style page background */
  --beige-deep:#DFD9CB;   /* subtle band */
  --white:#FFFFFF;
  --accent:#EA2029;
  --accent-deep:#C01A22;
  --max:1240px;
  --pad:clamp(20px,5vw,64px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Inter','Noto Sans KR',-apple-system,sans-serif;
  background:var(--beige); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
body.ko{font-family:'Noto Sans KR','Inter',sans-serif}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ---------- NAV ---------- */
header{
  position:sticky;top:0;z-index:100;
  background:rgba(233,228,217,.85);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.nav{display:flex;align-items:center;justify-content:space-between;height:74px;gap:18px}
.logo{font-size:20px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:32px;align-items:center}
.nav-links a{font-size:14.5px;font-weight:500;color:var(--ink-soft);transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:14px}

/* language toggle */
.lang{
  display:inline-flex;align-items:center;
  border:1px solid var(--line);border-radius:100px;overflow:hidden;background:rgba(255,255,255,.55);
}
.lang button{
  font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:.04em;
  padding:7px 14px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:.2s;
}
.lang button.on{background:var(--ink);color:#fff}
.lang button:not(.on):hover{color:var(--ink)}

.btn{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--ink);color:#fff;font-size:14.5px;font-weight:600;
  padding:12px 24px;border-radius:100px;transition:.25s;border:none;cursor:pointer;
  font-family:inherit;white-space:nowrap;
}
.btn:hover{background:var(--accent);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.menu-toggle{display:none;background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink)}

/* ---------- HERO ---------- */
.hero{padding:clamp(70px,11vw,140px) 0 clamp(56px,8vw,96px)}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin-bottom:26px;
}
.eyebrow::before{content:"";width:26px;height:1.5px;background:var(--accent)}
h1{
  font-size:clamp(42px,7.4vw,92px);line-height:1.02;
  font-weight:700;letter-spacing:-.037em;max-width:17ch;
}
h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)}
.hero-sub{
  margin-top:30px;font-size:clamp(16.5px,1.9vw,20px);
  color:var(--ink-soft);max-width:56ch;line-height:1.62;
}
.hero-cta{display:flex;gap:14px;margin-top:44px;flex-wrap:wrap}

/* marquee */
.marquee{
  margin-top:clamp(56px,8vw,90px);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:22px 0;overflow:hidden;
}
.marquee-track{display:flex;gap:56px;width:max-content;animation:slide 34s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.marquee-item{
  font-size:15px;font-weight:500;color:var(--muted);white-space:nowrap;
  display:flex;align-items:center;gap:56px;
}
.marquee-item::after{content:"◆";font-size:8px;color:var(--accent)}
@media(prefers-reduced-motion:reduce){.marquee-track{animation:none}}

/* ---------- SECTION SHELL ---------- */
section{padding:clamp(64px,9vw,120px) 0}
.sec-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:36px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,60px);
}
.sec-label{
  font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:16px;
}
h2{font-size:clamp(30px,4.6vw,54px);line-height:1.1;font-weight:700;letter-spacing:-.032em;max-width:19ch}
h2 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)}
.sec-desc{color:var(--ink-soft);max-width:40ch;font-size:16.5px;padding-bottom:6px}

/* ---------- SERVICES ---------- */
#services{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.svc{background:var(--white);padding:38px 32px;transition:.3s}
.svc:hover{background:var(--beige)}
.svc-num{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.1em;margin-bottom:22px}
.svc h3{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.svc p{font-size:15px;color:var(--ink-soft);line-height:1.62}
.svc ul{list-style:none;margin-top:18px;display:flex;flex-wrap:wrap;gap:7px}
.svc li{font-size:12.5px;color:var(--muted);border:1px solid var(--line);padding:4px 11px;border-radius:100px}

/* ---------- PORTFOLIO ---------- */
.filter-label{
  font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px;
}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.filters.scroller{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.filter{
  font-family:inherit;font-size:14.5px;font-weight:500;
  padding:10px 20px;border-radius:100px;border:1px solid var(--line);
  background:transparent;color:var(--ink-soft);cursor:pointer;transition:.22s;white-space:nowrap;
}
.filter:hover{border-color:var(--ink);color:var(--ink)}
.filter.active{background:var(--ink);border-color:var(--ink);color:#fff}
.filter-block{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid var(--line)}
.filter-block:last-of-type{border-bottom:1px solid var(--line)}
.count{font-size:14px;color:var(--muted);margin:26px 0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:26px}
.card{
  background:var(--white);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:.32s cubic-bezier(.2,.7,.3,1);
  animation:pop .38s cubic-bezier(.2,.7,.3,1) both;text-align:left;font-family:inherit;
  padding:0;display:block;width:100%;
}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 38px rgba(18,22,27,.13);border-color:transparent}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.thumb{aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--beige-deep)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.card:hover .thumb img{transform:scale(1.05)}
.tag{
  position:absolute;top:13px;left:13px;z-index:2;
  background:rgba(255,255,255,.94);color:var(--ink);
  font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:100px;
}
.card-body{padding:20px 22px 24px}
.card-body h4{font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:5px}
.card-body p{font-size:14px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:70px 0;color:var(--muted)}

/* ---------- ABOUT / STATS ---------- */
#about{background:var(--ink);color:var(--beige)}
#about .sec-label{color:rgba(233,228,217,.5)}
#about h2{color:var(--beige)}
#about .sec-desc{color:rgba(233,228,217,.68)}
.stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));
  gap:1px;background:rgba(233,228,217,.14);
  border:1px solid rgba(233,228,217,.14);margin-bottom:clamp(48px,7vw,80px);
}
.stat{background:var(--ink);padding:34px 28px}
.stat-num{font-size:clamp(38px,5.4vw,60px);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.stat-lbl{font-size:14px;color:rgba(233,228,217,.6);margin-top:12px}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(252px,1fr));gap:34px}
.value h3{font-size:19px;font-weight:700;margin-bottom:11px;letter-spacing:-.02em}
.value p{font-size:15px;color:rgba(233,228,217,.66);line-height:1.65}
.value::before{content:"";display:block;width:32px;height:2px;background:var(--accent);margin-bottom:19px}

/* ---------- PROCESS ---------- */
#process{background:var(--white);border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:34px}
.step{border-top:2px solid var(--ink);padding-top:22px}
.step-n{font-size:12.5px;font-weight:600;letter-spacing:.12em;color:var(--accent);margin-bottom:13px}
.step h3{font-size:19px;font-weight:700;margin-bottom:10px;letter-spacing:-.02em}
.step p{font-size:15px;color:var(--ink-soft);line-height:1.62}

/* ---------- CTA ---------- */
#contact{background:var(--beige);border-top:1px solid var(--line)}
.cta{text-align:center;max-width:760px;margin:0 auto}
.cta h2{margin:0 auto 22px;max-width:100%}
.cta p{color:var(--ink-soft);font-size:17.5px;margin-bottom:38px}
.cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}

/* ---------- FOOTER ---------- */
footer{background:var(--ink);color:rgba(233,228,217,.62);padding:60px 0 34px;font-size:14.5px}
.f-top{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap;padding-bottom:38px;border-bottom:1px solid rgba(233,228,217,.14)}
.f-brand{font-size:22px;font-weight:700;color:var(--beige);letter-spacing:-.03em;margin-bottom:11px}
.f-brand span{color:var(--accent)}
.f-cols{display:flex;gap:64px;flex-wrap:wrap}
.f-col h5{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(233,228,217,.42);margin-bottom:15px;font-weight:600}
.f-col a{display:block;margin-bottom:9px;transition:color .2s}
.f-col a:hover{color:var(--accent)}
.f-bot{padding-top:26px;font-size:13.5px;color:rgba(233,228,217,.42)}

/* ---------- MODAL ---------- */
.modal{
  position:fixed;inset:0;background:rgba(18,22,27,.74);backdrop-filter:blur(6px);
  z-index:200;display:none;place-items:center;padding:24px;
}
.modal.open{display:grid}
.modal-box{
  background:var(--white);border-radius:16px;max-width:640px;width:100%;
  overflow:hidden;animation:pop .3s cubic-bezier(.2,.7,.3,1) both;max-height:90vh;overflow-y:auto;
}
.modal-thumb{aspect-ratio:16/9;background:var(--beige-deep)}
.modal-thumb img{width:100%;height:100%;object-fit:cover}
.modal-body{padding:32px}
.modal-body h3{font-size:26px;font-weight:700;letter-spacing:-.028em;margin-bottom:8px}
.modal-body .m-cat{font-size:13px;color:var(--accent);font-weight:600;margin-bottom:18px}
.modal-body p{color:var(--ink-soft);font-size:15.5px;line-height:1.65;margin-bottom:14px}
.m-meta{font-size:13.5px;color:var(--muted);margin-bottom:24px}
.modal-close{
  background:var(--ink);color:#fff;border:none;font-family:inherit;
  padding:11px 24px;border-radius:100px;font-size:14.5px;font-weight:600;cursor:pointer;
}
.modal-close:hover{background:var(--accent)}

@media(max-width:820px){
  .nav-links{display:none}
  .menu-toggle{display:block}
  .sec-head{flex-direction:column;align-items:flex-start}
  .f-cols{gap:36px}
  .filters{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px}
}
</style>

<style>
/* ---- logo ---- */
.logo img{height:30px;width:auto;display:block}
.f-brand img{height:32px;width:auto;display:block;margin-bottom:14px}
@media(max-width:600px){.logo img{height:25px}}

/* ---- portfolio CTA box ---- */
.pf-cta{display:flex;align-items:center;justify-content:space-between;gap:28px;
  padding:clamp(30px,5vw,56px);border:1px solid var(--line);border-radius:16px;background:var(--white);
  text-decoration:none;color:inherit;cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s,border-color .3s}
.pf-cta:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(18,22,27,.10);border-color:transparent}
.pf-cta-title{font-size:clamp(25px,3.4vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
.pf-cta-sub{margin-top:12px;color:var(--ink-soft);font-size:16.5px;line-height:1.6;max-width:52ch}
.pf-cta-meta{margin-top:20px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;color:var(--accent)}
.pf-cta-arrow{font-size:34px;line-height:1;color:var(--accent);flex:none;transition:transform .3s cubic-bezier(.2,.7,.3,1)}
.pf-cta:hover .pf-cta-arrow{transform:translateX(8px)}
@media(max-width:700px){.pf-cta{flex-direction:column;align-items:flex-start;gap:18px}}

/* ---- portfolio page hero ---- */
.pf-hero{padding:clamp(56px,8vw,104px) 0 clamp(30px,4vw,48px)}
.pf-hero h1{font-size:clamp(38px,6vw,74px);line-height:1.04;font-weight:700;letter-spacing:-.037em;max-width:18ch}
.pf-hero h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)}
.pf-hero p{margin-top:24px;font-size:clamp(16px,1.8vw,19px);color:var(--ink-soft);max-width:56ch;line-height:1.62}
.back-link{display:inline-flex;align-items:center;gap:9px;margin-bottom:26px;font-size:14.5px;font-weight:600;
  color:var(--ink-soft);text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--accent)}
.nav-links a.current{color:var(--ink)}

/* ---- FAQ accordion ---- */
#faq{background:var(--white);border-top:1px solid var(--line)}
.faq-list{border-top:1px solid var(--line);max-width:900px}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;
  background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;
  padding:26px 0;font-size:clamp(17px,2vw,20px);font-weight:700;letter-spacing:-.02em;color:var(--ink);
  transition:color .2s}
.faq-q:hover{color:var(--accent)}
.faq-ico{flex:none;width:26px;height:26px;position:relative;margin-top:3px;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.faq-ico::before,.faq-ico::after{content:"";position:absolute;background:var(--accent);border-radius:2px;
  top:50%;left:50%;transform:translate(-50%,-50%)}
.faq-ico::before{width:16px;height:2px}
.faq-ico::after{width:2px;height:16px;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.faq-item.open .faq-ico{transform:rotate(180deg)}
.faq-item.open .faq-ico::after{transform:translate(-50%,-50%) scaleY(0)}
.faq-a{overflow:hidden;height:0;transition:height .38s cubic-bezier(.2,.7,.3,1)}
.faq-a-inner{padding:0 60px 28px 0;color:var(--ink-soft);font-size:16.5px;line-height:1.68;max-width:70ch}

/* ---- contact form ---- */
.form-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,5vw,72px);align-items:start}
@media(max-width:900px){.form-wrap{grid-template-columns:1fr}}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}
.field input,.field select,.field textarea{
  width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:var(--white);
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:border-color .2s,box-shadow .2s}
.field textarea{min-height:130px;resize:vertical;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(18,22,27,.07)}
.form-note{margin-top:14px;font-size:14px;color:var(--muted)}
.form-msg{margin-top:16px;font-size:15.5px;line-height:1.6;display:none}
.form-msg.show{display:block}
.form-msg.ok{color:#1F7A3D}
.form-msg.err{color:#C0392B}
.contact-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:clamp(26px,3.4vw,36px)}
.cc-group+.cc-group{margin-top:26px;padding-top:26px;border-top:1px solid var(--line)}
.cc-h{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.cc-line{font-size:16px;line-height:1.6;color:var(--ink-soft)}
.cc-line strong{display:block;color:var(--ink);font-weight:700;margin-bottom:3px;font-size:14.5px}
.cc-line a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);transition:border-color .2s,color .2s}
.cc-line a:hover{color:var(--accent);border-color:var(--accent)}
.cc-line+.cc-line{margin-top:14px}
/* two-line address → Google Maps */
a.cc-addr{display:inline-block;border-bottom:none;color:var(--ink-soft);line-height:1.55}
a.cc-addr:hover{color:var(--accent);border-bottom:none}
a.cc-addr::after{content:"↗";font-size:.78em;margin-left:7px;opacity:.5;transition:opacity .2s}
a.cc-addr:hover::after{opacity:1}

/* ================= 한국어 타이포그래피 =================
   body.ko 일 때만 적용. 영문 화면은 Inter / Instrument Serif 그대로. */
body.ko{
  font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',
              -apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  letter-spacing:-0.01em;                 /* 한글은 살짝 조여야 덩어리가 안 뜬다 */
}
/* 한글은 진짜 이탤릭이 없다. 기울이면 획이 뭉개지므로 세로로 두고 굵기로 강조한다. */
body.ko h1 em,
body.ko h2 em,
body.ko h3 em,
body.ko .pf-hero h1 em{
  font-family:'Nanum Myeongjo',serif;
  font-style:normal;
  font-weight:700;
}
/* 명조는 같은 크기에서 고딕보다 작아 보인다 */
body.ko h1 em,body.ko .pf-hero h1 em{font-size:1.04em}
body.ko h1,body.ko h2,body.ko .pf-hero h1{letter-spacing:-0.03em;word-break:keep-all}
/* 한글 문단은 단어 중간에서 끊기면 읽기 나쁘다 */
body.ko p,body.ko li,body.ko .faq-a-inner,body.ko .card-body p{word-break:keep-all}
/* 숫자와 영문 규격 표기는 라틴 폰트가 더 또렷하다 */
body.ko .filter,body.ko .tag{font-feature-settings:'tnum'}

/* ================= 크게 보기(모달) =================
   원래는 16:9 로 고정하고 object-fit:cover 라 명함·포스터처럼 세로가 긴 작업물이
   위아래로 잘려 나갔다. 포트폴리오에서 작업물이 잘리면 볼 이유가 없다.
   비율 고정을 풀고 전체가 들어오도록 contain 으로 바꾼다.
   폭도 640 → 1000px. 1600px 원본을 넣어두고 640px 로 보여주고 있었다. */
.modal-box{max-width:1000px}
.modal-thumb{
  aspect-ratio:auto;                      /* 비율 고정 해제 */
  display:flex;align-items:center;justify-content:center;
  background:var(--beige-deep);
  max-height:74vh;
}
.modal-thumb img{
  width:auto;height:auto;
  max-width:100%;max-height:74vh;
  object-fit:contain;                     /* 잘라내지 않고 전체를 담는다 */
}
.modal-thumb video{max-height:74vh;width:auto;max-width:100%}
@media(max-width:1060px){ .modal-box{max-width:92vw} }
@media(max-width:600px){
  .modal-thumb,.modal-thumb img,.modal-thumb video{max-height:56vh}
}

/* ================= 영상 작업물 ================= */
/* 카드에는 정지 이미지만 깔고 재생 배지를 얹는다 */
.play-badge{
  position:absolute;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;
  background:rgba(20,18,16,.62);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;pointer-events:none;
  transition:background .22s,transform .22s;
}
.play-badge::before{
  content:"";display:block;margin-left:3px;
  border-style:solid;border-width:8px 0 8px 13px;
  border-color:transparent transparent transparent #fff;
}
.card:hover .play-badge{background:var(--accent);transform:scale(1.08)}
.modal-thumb video{display:block;width:100%;height:auto;max-height:74vh;background:#141210}

/* ================= 더 보기 ================= */
.more-wrap{display:flex;justify-content:center;margin-top:38px}
.more-wrap:empty{margin-top:0}
.load-more{
  font-family:inherit;font-size:14.5px;font-weight:500;
  padding:13px 34px;border-radius:100px;border:1px solid var(--line);
  background:transparent;color:var(--ink);cursor:pointer;transition:.22s;
}
.load-more:hover{border-color:var(--ink);background:var(--ink);color:#fff}

/* 언어 토글 — 세로 높이 고정.
   line-height 가 normal 이라 버튼 높이가 글자 metrics 를 따라갔다. 그래서
   (1) EN 버튼이 29px, 한국어 버튼이 33px 로 달라 EN 을 눌렀을 때 검은 박스가
   위아래로 꽉 차지 않고 4px 이 비었고 (2) 알약 자체도 EN 35px / 한국어 31px 로
   언어마다 달랐다. 높이를 29px 로 못박고 글자를 가운데 정렬해 둘 다 해결한다.
   가로 폭은 글자 길이대로 두는 원래 모습 그대로. */
.lang{align-items:stretch}
.lang button{
  display:flex;align-items:center;justify-content:center;
  height:29px;padding-top:0;padding-bottom:0;
}

/* ================= 저작권 안내 ================= */
.f-bot{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.f-copy{color:rgba(246,244,239,.55)}
.f-legal-link{
  font-family:inherit;font-size:13.5px;background:none;border:0;padding:0;cursor:pointer;
  color:rgba(246,244,239,.62);border-bottom:1px solid rgba(246,244,239,.24);
  transition:color .2s,border-color .2s;
}
.f-legal-link:hover{color:var(--accent);border-color:var(--accent)}
.f-notice{
  margin-top:14px;padding-top:14px;border-top:1px solid rgba(246,244,239,.1);
  font-size:12.5px;line-height:1.65;color:rgba(246,244,239,.42);max-width:76ch;
}
.legal-ov{
  position:fixed;inset:0;z-index:200;display:none;
  background:rgba(20,18,16,.62);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;padding:24px;
}
.legal-ov.on{display:flex}
.legal-box{
  background:var(--beige,#F6F4EF);color:var(--ink);border-radius:14px;
  max-width:660px;width:100%;max-height:82vh;overflow-y:auto;
  padding:38px 40px 34px;position:relative;
}
.legal-x{
  position:absolute;top:14px;right:18px;background:none;border:0;cursor:pointer;
  font-size:30px;line-height:1;color:var(--muted);padding:4px 8px;
}
.legal-x:hover{color:var(--accent)}
.legal-box h3{font-size:23px;font-weight:700;letter-spacing:-.02em;margin:0 0 22px;padding-right:30px}
.legal-body section{margin-bottom:20px}
.legal-body h4{font-size:14px;font-weight:700;margin:0 0 5px;letter-spacing:-.01em}
.legal-body p{font-size:14px;line-height:1.72;color:var(--ink-soft);margin:0}
.legal-meta{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted)
}
@media(max-width:600px){
  .legal-box{padding:32px 22px 26px;max-height:88vh}
  .legal-box h3{font-size:20px}
}
/* 이미지 위에서 드래그·선택 되지 않게 (우클릭 차단과 한 세트) */
.thumb img,.modal-img img,.f-brand img{
  -webkit-user-drag:none;user-select:none;-webkit-user-select:none;
}

/* ---- service filter: many pills, so tighten and always wrap ---- */
#filtersProduct{gap:7px}
#filtersProduct .filter{font-size:13.5px;padding:8px 15px}
.filter-more{border-style:dashed;color:var(--muted)}
.filter-more:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
@media(max-width:760px){
  /* never horizontal-scroll the service row — too many items to hunt through */
  #filtersProduct{flex-wrap:wrap;overflow-x:visible}
  #filtersProduct .filter{font-size:13px;padding:7px 13px}
}

/* ---- footer contact ---- */
.f-contact .cc-line{color:rgba(246,244,239,.66);font-size:14.5px}
.f-contact .cc-line strong{color:rgba(246,244,239,.92)}
.f-contact .cc-line a{color:rgba(246,244,239,.78);border-bottom-color:rgba(246,244,239,.22)}
.f-contact .cc-line a:hover{color:var(--accent);border-bottom-color:var(--accent)}

(function(){
  const ov = $('legalOv');
  if (!ov) return;
  const open = () => { ov.classList.add('on'); document.body.style.overflow='hidden'; };
  const shut = () => { ov.classList.remove('on'); document.body.style.overflow=''; };
  $('legalOpen').onclick = open;
  $('legalClose').onclick = shut;
  ov.addEventListener('click', e => { if (e.target === ov) shut(); });

})();

let WORKS = [];
let activeProduct = null, activeIndustry = null;
function onLangChange(){ activeProduct = null; activeIndustry = null; showAllProd = false; resetPaging(); }

const prodOf = w => lang==='en' ? w.serviceEn  : w.serviceKo;
const indOf  = w => lang==='en' ? w.industryEn : w.industryKo;
const descOf = w => lang==='en' ? w.descEn     : w.descKo;

async function loadProjects(){
  try{
    const r = await fetch('data/projects.json', {cache:'no-store'});
    if(!r.ok) throw 0;
    const d = await r.json();
    WORKS = (d.projects||[]).slice();
  }catch(e){
    WORKS = FALLBACK_DATA.projects.slice();
  }
  /* 파일에 적힌 순서 그대로 쓴다.
     예전에는 order 숫자로 정렬했는데, 관리자 화면에서 행을 끌어 옮겨도
     order 값은 그대로라 화면이 안 바뀌었다. 이제 드래그한 순서가 곧 노출 순서다. */
}

function renderAll(){
  document.querySelectorAll('[data-i]').forEach(el=>{ el.textContent = t(el.dataset.i); });
  $('pfH1').innerHTML = t('pf.h1');
  renderFooter(); buildFilters(); renderGrid(); syncLinks();
}

/* canonical service order, injected at build time so EN and KO sort identically */
const SVC_ORDER = {"en":["2D/3D Rendering","Apparel","Branding","Brochure","Bulletin","Business Card","Canvas","Coupon","Digital Ad","Digital Menu","Drink Menu","EDDM","Envelope","Flyer","Gift Card","Invoice","Letterhead","Logo","Menu Board","Name Badge","Outdoor Banner","Packaging","Picture Board","Poster","Presentation Folder","Reception Sign","Signage","Stamp Card","Standing Banner","Sticker","Sublimation Goods","Table Menu","Table Tent","To-go Menu","Vehicle Decal","Wall Graphic","Website","Window Decal","Window Graphic","Window Poster","X-Banner","Yard Sign"],"ko":["2D/3D 렌더링","의류","브랜딩","브로슈어","주보","명함","캔버스","쿠폰","디지털 광고","디지털 메뉴","음료 메뉴","EDDM 우편광고","봉투","전단지","기프트카드","인보이스","레터헤드","로고","메뉴보드","명찰","외부 배너","패키지","픽처보드","포스터","프레젠테이션 폴더","리셉션 사인","사이니지","스탬프 카드","스탠딩 배너","스티커","승화 굿즈","테이블 메뉴","테이블 텐트","투고 메뉴","차량 데칼","월 그래픽","웹사이트","윈도우 데칼","윈도우 그래픽","윈도우 포스터","X배너","야드사인"]};
const svcRank = v => { const i = (SVC_ORDER[lang]||[]).indexOf(v); return i < 0 ? 9999 : i; };

/* how many service pills to show before collapsing behind a "more" button */
const PROD_LIMIT = 12;
let showAllProd = false;

function buildFilters(){
  /* 화면에 보이는 글자 기준으로 정렬한다.
     영문이면 A→Z, 한국어면 가→하. 예전에는 영문 순서를 한국어에도 그대로 써서
     한글 필터가 뒤죽박죽으로 보였다. 업종 필터는 아예 정렬이 없었다. */
  const byLabel = (a,b)=> a.localeCompare(b, lang==='ko' ? 'ko' : 'en',
                                          {numeric:true, sensitivity:'base'});
  const prods = [...new Set(WORKS.flatMap(prodOf))].sort(byLabel);
  const inds  = [...new Set(WORKS.flatMap(indOf))].sort(byLabel);

  /* keep an active-but-hidden pill visible, otherwise the user loses their filter */
  const overflow = prods.length - PROD_LIMIT;
  const canCollapse = overflow > 2;          // hiding 1-2 pills isn't worth a button
  const collapse = canCollapse && !showAllProd;
  let shown = collapse ? prods.slice(0, PROD_LIMIT) : prods;
  if (collapse && activeProduct && !shown.includes(activeProduct)) shown = shown.concat(activeProduct);

  $('filtersProduct').innerHTML =
    [`<button class="filter${activeProduct===null?' active':''}" data-v="">${t('work.all')}</button>`]
    .concat(shown.map(p=>`<button class="filter${activeProduct===p?' active':''}" data-v="${p}">${p}</button>`))
    .concat(canCollapse
      ? [`<button class="filter filter-more" id="prodMore" type="button">${
           showAllProd ? (lang==='ko' ? '접기' : 'Show less')
                       : (lang==='ko' ? '+ '+overflow+'개 더보기' : '+ '+overflow+' more')}</button>`]
      : []).join('');
  $('filtersIndustry').innerHTML =
    [`<button class="filter${activeIndustry===null?' active':''}" data-v="">${t('work.all')}</button>`]
    .concat(inds.map(p=>`<button class="filter${activeIndustry===p?' active':''}" data-v="${p}">${p}</button>`)).join('');
  $('filtersProduct').querySelectorAll('.filter:not(.filter-more)').forEach(b=>{
    b.onclick = ()=>{ activeProduct = b.dataset.v || null; resetPaging(); buildFilters(); renderGrid(); }; });
  const moreBtn = $('prodMore');
  if (moreBtn) moreBtn.onclick = ()=>{ showAllProd = !showAllProd; buildFilters(); };
  $('filtersIndustry').querySelectorAll('.filter').forEach(b=>{
    b.onclick = ()=>{ activeIndustry = b.dataset.v || null; resetPaging(); buildFilters(); renderGrid(); }; });
}

/* 한 번에 그리는 카드 수. 작업물이 수백 개가 되면 전부 한꺼번에 깔 때
   휴대폰에서 눈에 띄게 버벅인다. 60개씩 끊어 그리고 버튼으로 이어붙인다. */
const PAGE = 60;
let shownCount = PAGE;
function resetPaging(){ shownCount = PAGE; }

const isVideo = w => !!w.video;

function cardHtml(w, i){
  /* 영상은 정지 이미지(poster)를 깔고 재생 배지를 얹는다.
     그리드에서 영상을 자동재생하면 데이터도 배터리도 크게 쓴다. */
  return `
    <button class="card${isVideo(w)?' is-video':''}" style="animation-delay:${Math.min(i,12)*38}ms"
            onclick="openModal(${WORKS.indexOf(w)})">
      <div class="thumb"><span class="tag">${prodOf(w)[0]}</span>
        <img src="${w.image}" alt="${w.alt||w.title}" loading="lazy">
        ${isVideo(w)?'<span class="play-badge" aria-hidden="true"></span>':''}
      </div>
      <div class="card-body"><h4>${w.title}</h4><p>${prodOf(w).join(' · ')}</p></div>
    </button>`;
}

function renderGrid(){
  const list = WORKS.filter(w =>
    (!activeProduct  || prodOf(w).includes(activeProduct)) &&
    (!activeIndustry || indOf(w).includes(activeIndustry)));
  $('count').textContent = t('work.count')(list.length);
  if (!list.length){
    $('grid').innerHTML = `<div class="empty">${t('work.empty')}</div>`;
    $('moreWrap').innerHTML = '';
    return;
  }
  const slice = list.slice(0, shownCount);
  $('grid').innerHTML = slice.map(cardHtml).join('');
  const left = list.length - slice.length;
  $('moreWrap').innerHTML = left > 0
    ? `<button class="load-more" id="loadMore">${t('work.more')(Math.min(left, PAGE), left)}</button>`
    : '';
  const b = $('loadMore');
  if (b) b.onclick = ()=>{ shownCount += PAGE; renderGrid(); };
}

const modal = $('modal');
function openModal(i){
  const w = WORKS[i];
  /* 영상은 음소거로 자동재생 + 반복. 소리가 갑자기 나면 손님이 창을 닫는다.
     poster 를 지정해 두면 첫 프레임을 받기 전에도 빈 검은 칸이 안 보인다. */
  $('mThumb').innerHTML = w.video
    ? `<video src="${w.video}" poster="${w.image}" controls autoplay muted loop playsinline
              preload="metadata" aria-label="${w.alt||w.title}"></video>`
    : `<img src="${w.image}" alt="${w.alt||w.title}">`;
  $('mCat').textContent   = prodOf(w).join(' · ');
  $('mTitle').textContent = w.title;
  $('mDesc').textContent  = descOf(w);
  $('mMeta').textContent  = indOf(w).join(' · ');
  modal.classList.add('open');
}
function closeModal(){
  modal.classList.remove('open');
  /* 영상을 DOM 에 남겨두면 창을 닫아도 계속 재생되고 데이터를 계속 받는다 */
  const v = $('mThumb').querySelector('video');
  if (v){ v.pause(); v.removeAttribute('src'); v.load(); }
  $('mThumb').innerHTML = '';
}
modal.onclick = e => { if(e.target===modal) closeModal(); };
document.onkeydown = e => { if(e.key==='Escape') closeModal(); };

if (lang === 'ko'){ document.body.classList.add('ko'); document.documentElement.lang='ko';
  $('langKo').classList.add('on'); $('langEn').classList.remove('on'); }
loadProjects().then(renderAll);
</script>

# ---------------------------------------------------------------
# Sveltia CMS  —  e.NUE Design
# Edit portfolio projects at  https://YOURDOMAIN/admin
# ---------------------------------------------------------------
backend:
  name: github
  repo: enuedesign/enuedesign
  branch: main

# where uploaded images are stored / how the site refers to them
media_folder: "assets/portfolio"
public_folder: "assets/portfolio"

# keep uploads reasonable so the site stays fast
media_libraries:
  default:
    config:
      max_file_size: 3000000   # 3 MB per image

collections:
  - name: portfolio
    label: "Portfolio"
    files:
      - name: projects
        label: "Projects"
        file: "data/projects.json"
        description: "포트폴리오에 나오는 작업물입니다. 행을 끌어서 순서를 바꾸면 사이트에도 그 순서대로 나옵니다."
        fields:
          - label: "Projects"
            name: projects
            widget: list
            label_singular: "Project"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Client", name: client, widget: string, required: false }
              - { label: "Image", name: image, widget: image, hint: "Resize to about 1600px wide before uploading." }
              - { label: "Image alt text", name: alt, widget: string, hint: "Describe the image — this is what Google reads." }
              - { label: "Video (optional)", name: video, widget: file, required: false, hint: "MP4만. 넣으면 카드에 재생 버튼이 붙고 클릭 시 재생됩니다. 위 Image 는 영상의 표지로 쓰입니다." }

              - label: "Service (English)"
                name: serviceEn
                widget: select
                multiple: true
                options: ["2D/3D Rendering","A-Sign","Apparel","Branding","Brochure","Bulletin","Business Card","Business Hours","Canvas","Coupon","Digital Ad","Digital Menu","Drink Menu","EDDM","Envelope","Flag Banner","Flyer","Gift Card","Invoice","Letterhead","Logo","Menu Board","Name Badge","Outdoor Banner","Packaging","Picture Board","Poster","Presentation Folder","Reception Sign","Signage","Stamp Card","Standing Banner","Sticker","Sublimation Goods","Table Menu","Table Tent","To-go Menu","Vehicle Decal","Wall Graphic","Website","Window Decal","Window Graphic","Window Poster","X-Banner","Yard Sign"]
              - label: "Service (Korean)"
                name: serviceKo
                widget: select
                multiple: true
                options: ["2D/3D 렌더링","A형 입간판","의류","브랜딩","브로슈어","주보","명함","영업시간 안내","캔버스","쿠폰","디지털 광고","디지털 메뉴","음료 메뉴","EDDM 우편광고","봉투","깃발 배너","전단지","기프트카드","인보이스","레터헤드","로고","메뉴보드","명찰","외부 배너","패키지","픽처보드","포스터","프레젠테이션 폴더","리셉션 사인","사이니지","스탬프 카드","스탠딩 배너","스티커","승화 굿즈","테이블 메뉴","테이블 텐트","투고 메뉴","차량 데칼","월 그래픽","웹사이트","윈도우 데칼","윈도우 그래픽","윈도우 포스터","X배너","야드사인"]

              - label: "Industry (English)"
                name: industryEn
                widget: select
                multiple: true
                options: ["Beauty & Wellness","Church & Nonprofit","Dessert & Cafe","Donut Shop","Education","Industrial & Logistics","Medical & Dental","Professional Services","Real Estate & Construction","Restaurant","Retail"]
              - label: "Industry (Korean)"
                name: industryKo
                widget: select
                multiple: true
                options: ["뷰티 & 웰니스","교회 & 비영리","디저트 & 카페","도넛샵","교육","산업 & 물류","메디컬 & 덴탈","서비스업","부동산 & 건설","레스토랑","리테일"]

              - { label: "Description (English)", name: descEn, widget: text }
              - { label: "Description (Korean)",  name: descKo, widget: text }
              - { label: "Display order", name: order, widget: hidden, required: false }
